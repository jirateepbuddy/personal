name: Build MIX TV APK
on:
  push:
    branches: [mix-tv-launcher]
    paths:
      - 'mix-tv/**'
      - '.github/workflows/mix-tv-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK path
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        working-directory: mix-tv
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK manifest and signature
        run: |
          APK=mix-tv/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump permissions "$APK" | tee apk-permissions.txt
          if grep -q 'uses-permission' apk-permissions.txt; then
            echo "Unexpected permission in APK"; exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | grep -E 'package:|sdkVersion|targetSdkVersion|leanback' || true
          sha256sum "$APK"
      - name: Upload MIX TV debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MIX-TV-v1-debug-apk
          path: mix-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
