plugins { id 'com.android.application' }

android {
    namespace 'tv.mix.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'tv.mix.launcher'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
